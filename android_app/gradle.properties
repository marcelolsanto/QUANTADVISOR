# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

android.useAndroidX=true
# android.enableJetifier=true is deprecated and should be false for modern projects
android.enableJetifier=false

# Required for KSP compatibility with current AGP version
android.disallowKotlinSourceSets=false

# Suppress warnings about experimental/unsupported project options
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
